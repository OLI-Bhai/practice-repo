<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            border: 1px solid tomato;
            display: flex;
            width: 100%;
            height: 100vh;
            gap: 10px;
        }

        .container div {
            border-radius: 5px;
            display: flex;

            gap: 10px;
        }

        .header {
            width: 50%;
            height: 100%;
        }

        .footer {
            width: 50%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
        }

        .one {
            padding-left: 10px;
            padding-top: 10px;
            font-size: 1.5em;
            color: white;
            background-color: purple;

            width: 100%;
            height: 95%;
        }

        .two {
            padding-left: 10px;
            padding-top: 10px;
            font-size: 1.5em;
            color: white;
            background-color: orange;
            width: 100%;
            height: 49%;
        }

        .three {
            padding-left: 10px;
            padding-top: 10px;
            font-size: 1.5em;
            color: white;
            background-color: blueviolet;
            width: 48%;
            height: 46%;
        }

        .four {
            padding-left: 10px;
            padding-top: 10px;
            font-size: 1.5em;
            color: white;
            background-color: silver;
            width: 48%;
            height: 46%;
        }

        @media screen and (max-width: 360px) {

            .container {
                display: flex;
                flex-direction: column;
                width: 100%;
                /* grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 1fr); */
                /* height: 120%; */

            }

            .container div {
                width: 100%;
                /* height: 30%; */
            }

        }
    </style>
</head>

<body>



    <div class="container">
        <div class="header">
            <div class="one box">1</div>


        </div>

        <div class="footer">

            <div class="two box">2</div>
            <div class="three box">3</div>
            <div class="four box">4</div>
        </div>
    </div>



</body>

</html>
